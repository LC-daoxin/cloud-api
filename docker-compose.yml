version: "3.9"

services:
  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    container_name: uav-mediamtx
    restart: unless-stopped
    environment:
      # Mac Docker Desktop 桥接网络不转发容器 UDP，WebRTC ICE 必须强制走 TCP
      - MTX_WEBRTC_ICE_UDP_MUX_ADDRESS=
      - MTX_WEBRTC_ICE_TCP_MUX_ADDRESS=:8189
    volumes:
      - ./docker/mediamtx.yml:/mediamtx.yml:ro
    ports:
      - "8554:8554"        # RTSP
      - "8889:8889"        # WebRTC HTTP/WHEP
      - "8189:8189/tcp"    # WebRTC ICE over TCP（Mac 桥接网络专用）

  mysql:
    image: mysql:8.0
    container_name: uav-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${DB_NAME:-cloud_sample}
      MYSQL_USER: ${DB_USER:-uav_cloud}
      MYSQL_PASSWORD: ${DB_PASSWORD:-devpass}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb_buffer_pool_size=128M
      - --max_connections=50
      - --performance_schema=OFF
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/cloud_api.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3307:3306"   # 本机 3306 被占用，宿主机用 3307
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-devroot}"]
      interval: 10s
      timeout: 5s
      retries: 10

  account-migration:
    image: mysql:8.0
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:-devroot}
      MYSQL_DATABASE: ${DB_NAME:-cloud_sample}
    volumes:
      - ./sql/migrations/001_bcrypt_user_passwords.sql:/migration.sql:ro
    command:
      - sh
      - -c
      - mysql -h mysql -u root "$${MYSQL_DATABASE}" < /migration.sql

  redis:
    image: redis:7-alpine
    container_name: uav-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2
    container_name: uav-mqtt
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    ports:
      - "1883:1883"
      - "9001:9001"

  minio:
    image: minio/minio:latest
    container_name: uav-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OSS_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OSS_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9100:9000"
      - "9101:9001"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uav-cloud-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      account-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - JAVA_OPTS=-Xms256m -Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC
      - TZ=Asia/Shanghai
      # 以下变量均由 docker/config/application.yml 中的 ${VAR:default} 占位符读取。
      # 桥接网络（本文件）下应用容器连接各依赖一律使用 compose 服务名，不通过 .env 修改；
      # 需要对外（Pilot App / 遥控器 / 无人机）暴露的地址使用 *_EXTERNAL / MQTT_HOST 单独配置。
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-cloud_sample}
      - DB_USER=${DB_USER:-uav_cloud}
      - DB_PASSWORD=${DB_PASSWORD:-devpass}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # 内部地址：固定为 compose 服务名。桥接网络下容器无法回头访问宿主机 IP，
      # 不要把这里改成局域网 IP，否则 app 连不上 MQTT/OSS
      - BROKER_HOST=mqtt
      - BROKER_PORT=${MQTT_PORT:-1883}
      - BROKER_DRC_PORT=${MQTT_DRC_PORT:-9001}
      - OSS_ENDPOINT=http://minio:9000
      # 对外地址：登录接口回传给设备的 mqtt_addr / 预签名 URL 使用；
      # 本地 Mac 开发在 .env 中设 MQTT_HOST=<局域网IP> 和 OSS_EXTERNAL_ENDPOINT=http://<IP>:9100。
      # 留空则回退为内部地址（仅容器内可达）
      - BROKER_EXTERNAL_HOST=${MQTT_HOST:-}
      - OSS_EXTERNAL_ENDPOINT=${OSS_EXTERNAL_ENDPOINT:-}
      - OSS_ACCESS_KEY=${OSS_ACCESS_KEY:-minioadmin}
      - OSS_SECRET_KEY=${OSS_SECRET_KEY:-minioadmin}
      - JWT_SECRET=${JWT_SECRET:-dev-local-secret-replace-in-production-32chars}
      - RTSP_USERNAME=${RTSP_USERNAME:-admin}
      - RTSP_PASSWORD=${RTSP_PASSWORD:-admin}
      - RTSP_PORT=${RTSP_PORT:-8554}
    volumes:
      - ./docker/config/application.yml:/app/config/application.yml:ro
      - app_logs:/app/logs
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null && exit 0 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

volumes:
  mysql_data:
  redis_data:
  minio_data:
  mqtt_data:
  mqtt_log:
  app_logs:

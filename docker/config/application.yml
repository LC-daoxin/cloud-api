server:
  port: 9000

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: cloud-service
  datasource:
    druid:
      type: com.alibaba.druid.pool.DruidDataSource
      driver-class-name: com.mysql.cj.jdbc.Driver
      # DB_HOST/DB_PORT 等由 docker-compose 的 environment 注入，默认值对应 docker-compose.yml 里的 compose 服务名，
      # 单机 Docker Compose 部署无需改动；多节点独立部署时通过 .env 覆盖
      url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:cloud_sample}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      username: ${DB_USER:uav_cloud}
      password: ${DB_PASSWORD:devpass}
      initial-size: 2
      min-idle: 2
      max-active: 8
      max-wait: 60000
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    database: 0
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 4
        max-idle: 4
        min-idle: 0
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

jwt:
  issuer: UAV
  subject: CloudApi
  # 生产/多节点部署务必通过 JWT_SECRET 环境变量为每个节点设置独立密钥
  secret: ${JWT_SECRET:dev-local-secret-replace-in-production-32chars}
  age: 86400

mqtt:
  BASIC:
    protocol: MQTT
    # 应用自身连接 Broker 的地址（容器内部）。
    # 单机 Docker Compose（bridge网络）用服务名 mqtt，不需要改；
    # Jetson Nano host-network 部署由 compose 直接注入节点局域网 IP。
    # 注意：变量名不能以 MQTT_ 开头，Spring Boot 会把 MQTT_XXX 松散绑定成 mqtt.xxx，
    # 与此处 mqtt 节点本身被绑定为 Map<MqttUseEnum,...> 冲突，导致启动失败
    host: ${BROKER_HOST:mqtt}
    port: ${BROKER_PORT:1883}
    # 登录接口返回给外部设备（Pilot App / 遥控器 / 无人机）的对外地址。
    # 桥接网络下容器无法回头访问宿主机 IP，内外地址必须分开配置：
    # 本地 Mac Docker Desktop 通过 .env 的 MQTT_HOST=<局域网IP> 注入。
    # 未配置时回退为上面的 host（与旧行为一致）。
    external-host: ${BROKER_EXTERNAL_HOST:}
    username: uav_cloud_service
    password: any
    client-id: cloud_service_local
    path:
  DRC:
    protocol: WSS
    host: ${BROKER_HOST:mqtt}
    port: ${BROKER_DRC_PORT:9001}
    external-host: ${BROKER_EXTERNAL_HOST:}
    path: /mqtt
    username: cc_server
    password: any

cloud-sdk:
  mqtt:
    inbound-topic: sys/product/+/status,thing/product/+/requests,thing/product/+/state

url:
  manage:
    prefix: manage
    version: /api/v1
  map:
    prefix: map
    version: /api/v1
  media:
    prefix: media
    version: /api/v1
  wayline:
    prefix: wayline
    version: /api/v1
  storage:
    prefix: storage
    version: /api/v1
  control:
    prefix: control
    version: /api/v1

oss:
  enable: true
  provider: minio
  # OSS_ENDPOINT：应用自身访问 MinIO 的地址（容器内部，默认走服务名 minio）。
  # OSS_EXTERNAL_ENDPOINT：下发给外部设备的预签名 URL / STS endpoint 使用的对外地址，
  # 需为外部设备可访问的地址（如 http://192.168.3.1:9100）；
  # 未配置时回退为 endpoint，与旧行为一致。
  endpoint: ${OSS_ENDPOINT:http://minio:9000}
  external-endpoint: ${OSS_EXTERNAL_ENDPOINT:}
  access-key: ${OSS_ACCESS_KEY:minioadmin}
  secret-key: ${OSS_SECRET_KEY:minioadmin}
  bucket: uav-store
  expire: 3600
  region:
  object-dir-prefix: wayline

logging:
  level:
    # 修正原配置的 com.dji 错误包名
    com.uav: debug
  file:
    name: /app/logs/cloud-service.log

ntp:
  server:
    host: time.apple.com

cloud-api:
  app:
    id: dev-app-id
    key: dev-app-key
    license: dev-license

livestream:
  url:
    rtmp:
      url: rtmp://localhost:1936/live/
      payUrl: http://localhost:8081/index/api/webrtc?app=live&stream=%s&type=play
    rtsp:
      username: ${RTSP_USERNAME:admin}
      password: ${RTSP_PASSWORD:admin}
      port: ${RTSP_PORT:8554}
    gb28181:
      serverIP: 0.0.0.0
      serverPort: 8080
      serverID: "34020000002000000001"
      agentID: "34020000002000000001"
      agentPassword: admin
      localPort: 8081
      channel: "34020000001320000001"
    whip:
      url: ""

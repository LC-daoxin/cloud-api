# Nano（host 网络）默认配置，由 docker-compose.nano.yml 挂载。
# Mac Docker Desktop 请使用 mediamtx.mac.yml（桥接网络不转发 UDP）。

logLevel: info
logDestinations: [stdout]

rtsp: true
rtspAddress: :8554
# RTSP 传输：Nano 为 host 网络，UDP 可用。必须允许 udp——
# 设备推流端与低延迟播放（-rtsp_transport udp）用 UDP 请求时，
# 若此处只有 tcp 会被服务端拒绝（461 Unsupported Transport）。
rtspTransports: [udp, tcp]

# HLS 默认 :8888 与 Nano 上的 Jupyter Lab 冲突，改用 8881
hlsAddress: :8881

webrtc: true
webrtcAddress: :8889
# WebRTC ICE 媒体端口 mux：固定端口避免防火墙阻断随机动态端口。
# UDP 首选（:8189），TCP 回退（:8190，UDP 被阻断时 ICE 自动切换）。
webrtcICEUDPMuxAddress: :8189
webrtcICETCPMuxAddress: :8190

pathDefaults:
  source: publisher

paths:
  all_others:

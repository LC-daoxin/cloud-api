# Nano（host 网络）默认配置，由 docker-compose.nano.yml 挂载。
# Mac Docker Desktop 请使用 mediamtx.mac.yml（桥接网络不转发 UDP）。

logLevel: info
logDestinations: [stdout]

rtsp: true
rtspAddress: :8554
# RTSP 强制 TCP 传输
rtspTransports: [tcp]

webrtc: true
webrtcAddress: :8889
# WebRTC ICE 媒体端口 mux：固定端口避免防火墙阻断随机动态端口。
# UDP 首选（:8189），TCP 回退（:8190，UDP 被阻断时 ICE 自动切换）。
webrtcICEUDPMuxAddress: :8189
webrtcICETCPMuxAddress: :8190

pathDefaults:
  source: publisher

paths:
  all_others:
